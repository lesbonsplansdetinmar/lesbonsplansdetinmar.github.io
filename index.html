<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Les bons plans gourmands de Tinmar à Paris : carte, horaires, notes et avis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=8">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Les bons plans de Tinmar</title>
<meta name="apple-mobile-web-app-title" content="Bons plans Tinmar">
<meta name="theme-color" content="#0B1030">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap">
<style>
/* Layout : carte plein écran ; par-dessus, des fenêtres de menu 16 bits (titre, zoom, panneau d'adresses à droite sur ordinateur, tiroir en bas sur téléphone). Thème unique, nuit bleue. */
:root {
  --night: #0B1030;
  --land: #18214D;
  --street: #2A3672;
  --major: #46559F;
  --water: #2C6FD1;
  --green: #1D5442;
  --cem: #202B5C;
  --rail: #36427E;
  --border: #6D7BD0;
  --label: #C9D1FF;
  --win: #151E6E;
  --win-2: #0E1550;
  --edge: #F2F4FF;
  --edge-dark: #05082A;
  --text: #F2F4FF;
  --dim: #A3ACE6;
  --gold: #F8D030;
  --c-resto: #F8D030;
  --c-street: #F86848;
  --c-sucre: #58D8F8;
  --c-boutique: #C098F8;
  --c-andou: #F0A078;
  --ok: #78E878;
  --ko: #F87878;
  --f-pixel: "Press Start 2P", "Courier New", monospace;
  --f-text: "DotGothic16", "Osaka", "MS Gothic", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--night); color: var(--text); font-family: var(--f-text); font-size: 15px; line-height: 1.55; overflow: hidden; -webkit-font-smoothing: none; }
button, input { font: inherit; color: inherit; }

/* ---- Fenêtres de menu ---- */
.win {
  background: linear-gradient(180deg, var(--win) 0%, var(--win-2) 100%);
  border: 3px solid var(--edge);
  border-radius: 7px;
  box-shadow: 0 0 0 2px var(--edge-dark), inset 0 0 0 2px var(--edge-dark), 4px 4px 0 2px rgba(0,0,0,.35);
  text-shadow: 2px 2px 0 var(--edge-dark);
}

.app { position: fixed; inset: 0; }
canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--night); }
svg#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; background: transparent; }
svg#map.dragging { cursor: grabbing; }
.arr { fill: var(--land); }
.arr-b { fill: none; stroke: var(--border); stroke-width: 1px; stroke-dasharray: 2 4; vector-effect: non-scaling-stroke; opacity: .55; }
.green { fill: var(--green); }
.cem { fill: var(--cem); }
.water { fill: var(--water); fill-rule: evenodd; }
.rail { fill: none; stroke: var(--rail); stroke-width: 1px; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.hw { fill: none; stroke: var(--street); stroke-width: calc(clamp(1px, var(--z) * 0.9px, 6px)); vector-effect: non-scaling-stroke; }
.minor { fill: none; stroke: var(--street); stroke-width: calc(clamp(0.6px, var(--z) * 0.8px, 10px)); vector-effect: non-scaling-stroke; stroke-linecap: square; }
.major { fill: none; stroke: var(--major); stroke-width: calc(clamp(1.2px, var(--z) * 1.4px, 15px)); vector-effect: non-scaling-stroke; stroke-linecap: square; }
.arr-n { font-family: var(--f-pixel); font-size: calc(var(--u) * 12px); fill: var(--border); opacity: .6; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.labels text { font-family: var(--f-text); font-size: calc(var(--u) * 48px); fill: var(--label); text-anchor: middle; dominant-baseline: middle; paint-order: stroke; stroke: var(--land); stroke-width: calc(var(--u) * 14px); stroke-linejoin: round; pointer-events: none; }
.lab-off .labels { display: none; }
.lab1 .labels .t2 { display: none; }
.pin { cursor: pointer; }
.pin rect { fill: var(--c); stroke: var(--edge-dark); shape-rendering: crispEdges; }
.pin rect.halo { fill: var(--gold); stroke: var(--edge-dark); }
.pin rect.h-andou { fill: #E83838; }
.pin.f-resto { --c: var(--c-resto); } .pin.f-street { --c: var(--c-street); } .pin.f-sucre { --c: var(--c-sucre); } .pin.f-boutique { --c: var(--c-boutique); }
.pin.dim { opacity: .18; pointer-events: none; }
.pin:focus-visible { outline: none; }
.pin:focus-visible rect, .pin:hover rect { stroke: var(--edge); }
.cursor-arrow { fill: var(--edge); stroke: var(--edge-dark); shape-rendering: crispEdges; animation: blink 1s steps(2) infinite; }
.pin-name { font-family: var(--f-pixel); font-size: calc(var(--u) * 10px); fill: var(--text); paint-order: stroke; stroke: var(--edge-dark); stroke-width: calc(var(--u) * 5px); stroke-linejoin: miter; pointer-events: none; }

/* ---- Titre ---- */
.title { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 12px); padding: 10px 14px; display: grid; gap: 4px; max-width: calc(100vw - 110px); }
.title h1 { margin: 0; font-family: var(--f-pixel); font-size: 13px; font-weight: 400; color: var(--gold); line-height: 1.4; }
.title .sub { font-family: var(--f-pixel); font-size: 8px; color: var(--dim); line-height: 1.6; }

/* ---- Zoom ---- */
.tools { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 8px; }
.tbtn { width: 44px; height: 44px; display: grid; place-items: center; font-family: var(--f-pixel); font-size: 14px; cursor: pointer; padding: 0; }
.tbtn.wide { font-size: 7px; line-height: 1.5; }
.tbtn:active { transform: translate(2px, 2px); }
.tbtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* ---- Panneau ---- */
.panel { position: absolute; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel-head { padding: 12px 14px 10px; display: grid; gap: 10px; border-bottom: 2px solid var(--edge-dark); flex: none; }
.grab { display: none; }
.count { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--f-pixel); font-size: 9px; color: var(--dim); }
.count b { color: var(--text); font-weight: 400; }
.search { width: 100%; background: var(--edge-dark); border: 2px solid var(--border); border-radius: 4px; padding: 8px 10px; font-family: var(--f-text); font-size: 16px; color: var(--text); }
.search::placeholder { color: var(--dim); }
.search:focus { outline: none; border-color: var(--gold); }
.menu { display: grid; gap: 8px; }
.menu .frow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.menu .frow .chip { grid-column: span 2; }
#f-boutique { grid-column: span 4; }
.menu .frow.toggles .chip { grid-column: span 3; }
.menu .frow.toggles #f-tin { grid-column: span 6; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 6px 10px; background: var(--edge-dark); border: 2px solid var(--border); border-radius: 4px; cursor: pointer; font-family: var(--f-pixel); font-size: 8px; line-height: 1.4; color: var(--dim); text-shadow: none; white-space: nowrap; }
.menu .chip { min-width: 0; min-height: 40px; white-space: normal; text-align: left; line-height: 1.5; padding: 6px 8px; }
.chip .sw { width: 8px; height: 8px; border: 1px solid var(--edge-dark); flex: none; }
.chip[aria-pressed="true"] { color: var(--edge-dark); background: var(--gold); border-color: var(--edge); }
.chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.chip:active { transform: translate(1px, 1px); }
.chip .box { width: 12px; height: 12px; flex: none; border: 2px solid currentColor; display: grid; place-items: center; }
.chip[aria-pressed="true"] .box::after { content: ""; width: 4px; height: 4px; background: currentColor; }
.chip.open-now[aria-pressed="true"] { background: var(--ok); }
.chip.andou-f[aria-pressed="true"] { background: var(--c-andou); }
.chip:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.opt { background: none; border: 0; padding: 6px 4px 6px 18px; position: relative; cursor: pointer; font-family: var(--f-pixel); font-size: 9px; color: var(--dim); line-height: 1.3; text-shadow: 2px 2px 0 var(--edge-dark); }
.opt .sw { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border: 1px solid var(--edge-dark); vertical-align: 0; }
.opt[aria-pressed="true"] { color: var(--text); }
.opt[aria-pressed="true"]::before, .opt:focus-visible::before { content: ""; position: absolute; left: 3px; top: 50%; margin-top: -5px; border: 5px solid transparent; border-left: 8px solid var(--edge); border-right: 0; }
.opt:focus-visible { outline: none; color: var(--gold); }
.opt.open-now[aria-pressed="true"] { color: var(--ok); }
.panel-body { overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; padding: 6px 0 12px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.item { display: grid; grid-template-columns: 18px 10px minmax(0, 1fr); gap: 0 8px; align-items: start; width: 100%; text-align: left; background: none; border: 0; padding: 9px 14px 9px 6px; cursor: pointer; text-shadow: 2px 2px 0 var(--edge-dark); }
.item .cur { visibility: hidden; width: 0; height: 0; margin-top: 4px; border: 6px solid transparent; border-left: 10px solid var(--edge); border-right: 0; justify-self: end; animation: blink 1s steps(2) infinite; }
.item:hover .cur, .item:focus-visible .cur { visibility: visible; }
.item:focus-visible { outline: none; background: rgba(255,255,255,.06); }
.item .sw { width: 10px; height: 10px; margin-top: 6px; border: 2px solid var(--edge-dark); }
.item .nm { font-size: 16px; line-height: 1.35; color: var(--text); overflow-wrap: anywhere; }
.item .ln { grid-column: 3; font-size: 13px; color: var(--dim); }
.st-ok { color: var(--ok); } .st-ko { color: var(--ko); }
.empty { padding: 16px 20px; color: var(--dim); margin: 0; }
@keyframes blink { 50% { opacity: 0; } }

.detail { padding: 6px 16px 16px; display: grid; gap: 12px; }
.back { justify-self: start; }
.detail h2 { margin: 0; font-family: var(--f-pixel); font-size: 13px; font-weight: 400; line-height: 1.5; color: var(--gold); text-wrap: balance; }
.detail .kind { font-family: var(--f-pixel); font-size: 8px; color: var(--dim); display: flex; align-items: center; gap: 8px; line-height: 1.6; }
.detail .kind .sw { width: 10px; height: 10px; border: 2px solid var(--edge-dark); flex: none; }
.detail p { margin: 0; font-size: 15.5px; line-height: 1.6; max-width: 60ch; }
.stats { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 14.5px; margin: 0; }
.stats dt { font-family: var(--f-pixel); font-size: 8px; color: var(--dim); padding-top: 5px; }
.stats dd { margin: 0; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-family: var(--f-pixel); font-size: 8px; padding: 4px 6px; border: 2px solid var(--border); border-radius: 3px; color: var(--text); }
.acts { display: grid; gap: 2px; }
.act { display: block; position: relative; padding: 9px 4px 9px 22px; font-family: var(--f-pixel); font-size: 9px; line-height: 1.4; color: var(--text); text-decoration: none; }
.act::before { content: ""; position: absolute; left: 4px; top: 50%; margin-top: -5px; border: 5px solid transparent; border-left: 8px solid var(--edge); border-right: 0; opacity: .35; }
.act:hover::before, .act:focus-visible::before { opacity: 1; }
.act:focus-visible { outline: none; color: var(--gold); }
.note { color: var(--dim); }

/* ---- Notes ---- */
.px-star { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; fill: currentColor; shape-rendering: crispEdges; }
.avg { color: var(--gold); }
.rate { display: grid; gap: 4px; }
.rate .rl { font-family: var(--f-pixel); font-size: 8px; color: var(--dim); line-height: 1.6; }
.stars { display: flex; gap: 0; margin-left: -8px; }
.star { width: 44px; height: 44px; padding: 0; background: none; border: 0; cursor: pointer; display: grid; place-items: center; color: var(--major); }
.star svg { width: 26px; height: 26px; filter: drop-shadow(2px 2px 0 var(--edge-dark)); }
.star.on { color: var(--gold); }
@media (hover: hover) { .stars:hover .star { color: var(--gold); } .stars .star:hover ~ .star { color: var(--major); } }
.star:active svg { transform: translate(1px, 1px); }
.star:focus-visible { outline: 2px solid var(--gold); outline-offset: -4px; }
.ln .avg { white-space: nowrap; }
.act.btn.unrate { padding-top: 4px; padding-bottom: 4px; font-size: 8px; }

/* ---- Andouillette pétroleuse ---- */
.px-saus { width: 1.5em; height: 1em; display: inline-block; vertical-align: -0.15em; shape-rendering: crispEdges; }
.opt.andou-f[aria-pressed="true"] { color: var(--c-andou); }
.andou { display: grid; gap: 6px; padding: 10px 12px; border: 2px dashed var(--border); border-radius: 4px; }
.andou.yes { border: 2px solid var(--c-andou); }
.andou .ah { font-family: var(--f-pixel); font-size: 9px; line-height: 1.6; color: var(--c-andou); display: flex; gap: 8px; align-items: center; }
.andou .ap { font-size: 14px; color: var(--dim); margin: 0; }
.andou .act.btn { padding-left: 22px; color: var(--text); }
.andou .act.btn[disabled] { color: var(--ok); cursor: default; }
.andou .act.btn[disabled]::before { display: none; }
.andou-t { color: var(--c-andou); }
.tin-t { color: var(--gold); white-space: nowrap; }
.tag.t-tin { border-color: var(--gold); color: var(--gold); }
.detail p.tnote { color: var(--gold); }
.chip.tin-f[aria-pressed="true"] { background: var(--gold); }
.ap.ok-t { color: var(--ok); }
.tag.t-andou { border-color: var(--c-andou); color: var(--c-andou); }

/* ---- Avis ---- */
.avis { display: grid; gap: 10px; }
.avis-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.avis-h .t { font-family: var(--f-pixel); font-size: 9px; color: var(--text); line-height: 1.6; }
.chip.small { min-height: 32px; padding: 5px 9px; }
.cm { display: grid; gap: 5px; padding: 10px 12px; background: rgba(5, 8, 42, .5); border-left: 3px solid var(--border); border-radius: 2px; }
.cm.mine { border-left-color: var(--gold); }
.cm .plat { font-family: var(--f-pixel); font-size: 8px; line-height: 1.7; color: var(--gold); }
.cm p { margin: 0; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
.cm .by { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--dim); }
.cm .del { background: none; border: 0; padding: 4px 0; cursor: pointer; font-family: var(--f-pixel); font-size: 7px; color: var(--dim); }
.cm .del.sure { color: var(--ko); }
.compose { display: grid; gap: 10px; padding: 12px; border: 2px solid var(--border); border-radius: 4px; }
.compose .row2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cnt { font-size: 13px; color: var(--dim); }
.compose .go { padding: 10px 14px; font-size: 9px; }
.px-bub { width: 1.1em; height: 1em; display: inline-block; vertical-align: -0.12em; shape-rendering: crispEdges; fill: var(--dim); }

/* ---- Proposer ---- */
.title .add { justify-self: start; margin-top: 2px; padding: 6px 4px 4px 18px; font-size: 8px; color: var(--text); }
.title .add::before, .act.btn::before { content: ""; position: absolute; left: 3px; top: 50%; margin-top: -5px; border: 5px solid transparent; border-left: 8px solid var(--gold); border-right: 0; }
.act.btn { background: none; border: 0; width: 100%; text-align: left; cursor: pointer; color: var(--dim); text-shadow: 2px 2px 0 var(--edge-dark); }
.act.btn::before { left: 4px; border-left-color: var(--edge); opacity: .35; }
.act.btn:hover::before, .act.btn:focus-visible::before { opacity: 1; }
.modal-bg { position: fixed; inset: 0; z-index: 20; display: none; align-items: flex-start; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 14px) 10px calc(env(safe-area-inset-bottom, 0px) + 14px); background: rgba(5, 8, 42, .62); overflow-y: auto; overscroll-behavior: contain; }
.modal-bg.on { display: flex; }
.modal { width: min(440px, 100%); padding: 16px 16px 18px; display: grid; gap: 14px; margin: auto 0; }
.modal h2 { margin: 0; font-family: var(--f-pixel); font-size: 12px; font-weight: 400; line-height: 1.5; color: var(--gold); }
.modal .lead { margin: 0; font-size: 14.5px; color: var(--dim); }
.mhead { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.x { width: 36px; height: 36px; flex: none; margin: -6px -6px 0 0; background: none; border: 0; cursor: pointer; font-family: var(--f-pixel); font-size: 12px; color: var(--dim); }
.x:hover, .x:focus-visible { color: var(--gold); outline: none; }
.fld { display: grid; gap: 6px; position: relative; }
.fld > label, .fld > .lab { font-family: var(--f-pixel); font-size: 8px; color: var(--dim); line-height: 1.6; }
.inp { width: 100%; background: var(--edge-dark); border: 2px solid var(--border); border-radius: 4px; padding: 9px 10px; font-family: var(--f-text); font-size: 16px; color: var(--text); }
.inp::placeholder { color: var(--dim); opacity: .8; }
.inp:focus { outline: none; border-color: var(--gold); }
textarea.inp { min-height: 84px; resize: vertical; line-height: 1.45; }
.chips { display: flex; flex-wrap: wrap; gap: 2px 8px; }
.sug { position: absolute; left: 0; right: 0; top: 100%; z-index: 2; margin: 2px 0 0; padding: 4px 0; list-style: none; display: none; }
.sug.on { display: block; }
.sug button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 12px; font-size: 15px; cursor: pointer; text-shadow: 2px 2px 0 var(--edge-dark); }
.sug button:hover, .sug button:focus-visible { background: rgba(255,255,255,.08); outline: none; color: var(--gold); }
.mfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.go { font-family: var(--f-pixel); font-size: 10px; padding: 12px 16px; background: var(--gold); color: var(--edge-dark); border: 3px solid var(--edge); border-radius: 5px; box-shadow: 0 0 0 2px var(--edge-dark), 3px 3px 0 2px rgba(0,0,0,.35); cursor: pointer; }
.go:active { transform: translate(2px, 2px); }
.go:disabled { opacity: .5; cursor: default; }
.go:focus-visible { outline: 2px solid var(--edge); outline-offset: 3px; }
.msg { font-size: 14px; color: var(--ko); min-height: 1em; }
.msg.ok { color: var(--ok); }
.hint { font-size: 13px; color: var(--dim); }

/* Ordinateur : panneau à droite */
@media (min-width: 761px) {
  .panel { right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: 380px; }
  .tools { right: calc(max(12px, env(safe-area-inset-right, 0px)) + 396px); }
}
/* Téléphone : tiroir en bas */
@media (max-width: 760px) {
  .panel { left: max(6px, env(safe-area-inset-left, 0px)); right: max(6px, env(safe-area-inset-right, 0px)); bottom: -3px; height: calc(88% - env(safe-area-inset-top, 0px)); border-bottom-left-radius: 0; border-bottom-right-radius: 0; transform: translateY(var(--off, 0px)); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .panel-body { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .panel.dragging { transition: none; }
  .grab { display: block; width: 100%; height: 22px; margin: -8px 0 -6px; background: none; border: 0; cursor: grab; position: relative; }
  .grab::after { content: ""; position: absolute; left: 50%; top: 9px; width: 40px; height: 4px; margin-left: -20px; background: var(--border); box-shadow: 0 2px 0 var(--edge-dark); }
  .panel-head { touch-action: none; }
  .title { padding: 8px 10px; }
  .title h1 { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { .cursor-arrow, .item .cur { animation: none; } .panel { transition: none; } }
</style>

</head>
<body>
<div class="app" id="app">
  <canvas id="cv" aria-hidden="true"></canvas>
  <svg id="map" role="img" aria-label="Plan de Paris et de la petite couronne avec les bons plans de Tinmar">
    <g id="pins"></g>
  </svg>

  <div class="win title">
    <h1>LES BONS PLANS<br>DE TINMAR</h1>
    <div class="sub" id="sub"></div>
    <button class="opt add" id="addBtn" type="button">PROPOSER UN LIEU</button>
  </div>

  <div class="tools">
    <button class="win tbtn" id="zin" type="button" aria-label="Zoomer">+</button>
    <button class="win tbtn" id="zout" type="button" aria-label="Dézoomer">−</button>
    <button class="win tbtn wide" id="reset" type="button" aria-label="Tout voir">TOUT<br>VOIR</button>
  </div>

  <section class="win panel" id="panel" aria-label="Adresses">
    <div class="panel-head" id="phead">

        '<div class="fld"><span class="lab">SPÉCIALITÉ</span><div class="chips" id="fandou">' + chip('a', '1', 'SERT L\'ANDOUILLETTE PÉTROLEUSE', false) + '</div></div>' +
        '<div class="fld"><label for="fmsg">QU\'EST-CE QUI EST BON ?</label><textarea class="inp" id="fmsg" maxlength="600" placeholder="Spécialité, plat à prendre, prix…"></textarea></div>';
    mmsg.textContent = ''; mmsg.className = 'msg'; mgo.disabled = false; mgo.textContent = 'ENVOYER'; $('mhint').textContent = 'Tinmar vérifie chaque lundi.';
    mbg.classList.add('on');
    mbody.querySelectorAll('.chips').forEach(g => g.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b) return;
      g.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
      if (b.dataset.a) { form.andou = !form.andou; b.setAttribute('aria-pressed', form.andou ? 'true' : 'false'); return; }
      if (b.dataset.k) form.kind = b.dataset.k; if (b.dataset.c) form.concept = b.dataset.c;
    }));
    if (!p) addrSuggest();
    setTimeout(() => { const f = mbody.querySelector('input, textarea'); if (f && !isPhone()) f.focus(); else mform.querySelector('.x').focus({ preventScroll: true }); }, 30);
  }
  function closeForm() { mbg.classList.remove('on'); form = null; if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true }); }
  $('mx').addEventListener('click', closeForm);
  mbg.addEventListener('click', e => { if (e.target === mbg) closeForm(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && form) { e.stopImmediatePropagation(); closeForm(); } }, true);
  $('addBtn').addEventListener('click', () => openForm(null));
  function addrSuggest() {
    const inp = $('fadr'), ul = $('fsug'); let t, ctl;
    inp.addEventListener('input', () => {
      clearTimeout(t); const q = inp.value.trim(); if (q.length < 4) { ul.classList.remove('on'); return; }
      t = setTimeout(async () => {
        try {
          if (ctl) ctl.abort(); ctl = new AbortController();
          const j = await fetch('https://api-adresse.data.gouv.fr/search/?limit=5&lat=48.86&lon=2.35&q=' + encodeURIComponent(q), { signal: ctl.signal }).then(r => r.json());
          const hits = (j.features || []).map(f => f.properties.label);
          ul.innerHTML = hits.map(h => '<li><button type="button">' + esc(h) + '</button></li>').join('');
          ul.classList.toggle('on', hits.length > 0);
        } catch (_) {}
      }, 250);
    });
    ul.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; inp.value = b.textContent; ul.classList.remove('on'); });
    inp.addEventListener('blur', () => setTimeout(() => ul.classList.remove('on'), 200));
  }
  mform.addEventListener('submit', async e => {
    e.preventDefault(); if (!form) return;
    const v = id => ($(id) && $(id).value || '').trim();
    const p = form.place, msg = v('fmsg');
    if (!p) {
      if (!v('fnom')) { mmsg.textContent = 'Il manque le nom du lieu.'; $('fnom').focus(); return; }
      if (v('fadr').length < 5) { mmsg.textContent = 'Il manque l\'adresse.'; $('fadr').focus(); return; }
    } else if (form.kind === 'correction' && !msg) { mmsg.textContent = 'Dis-moi ce qui est faux.'; $('fmsg').focus(); return; }
    mgo.disabled = true; mgo.textContent = 'ENVOI…'; mmsg.textContent = '';
    try {
      await rpc('submit', { p_kind: form.kind, p_place: p ? p.id : '', p_nom: p ? p.nom : v('fnom'), p_adresse: p ? p.adresse : v('fadr'), p_concept: p ? '' : (form.concept || ''), p_message: msg, p_device: DEV, p_andouillette: p ? null : !!form.andou });
      mbody.innerHTML = '<p class="lead" style="color:var(--text)">C\'est noté, merci ! Tinmar vérifie l\'adresse et ses horaires, puis met la carte à jour le lundi.</p>';
      mmsg.textContent = ''; $('mhint').textContent = ''; mgo.disabled = false; mgo.textContent = 'FERMER';
      form = { done: true };
    } catch (err) {
      mgo.disabled = false; mgo.textContent = 'ENVOYER';
      mmsg.textContent = /limit/.test(err.message) ? 'Beaucoup d\'envois aujourd\'hui : réessaie demain.' : 'Envoi impossible (connexion ?). Réessaie.';
    }
  });
  mform.addEventListener('click', e => { if (form && form.done && e.target === mgo) { e.preventDefault(); closeForm(); } });

  // ---------- Démarrage ----------
  $('sub').textContent = places.length + ' LIEUX · MAJ ' + D.updated.slice(8, 10) + '/' + D.updated.slice(5, 7);
  sync();
  let booted = false;
  new ResizeObserver(() => {
    if (!W()) return;
    sizeCanvas();
    setSheet(sheet);
    if (!booted) { booted = true; vb = clamp(homeView()); }
    else { const c = [vb[0] + vb[2] / 2, vb[1] + vb[3] / 2]; vb = clamp([c[0] - vb[2] / 2, c[1] - vb[2] * aspect() / 2, vb[2]]); }
    apply(); draw(true);
  }).observe(app);
  setInterval(() => { NOW = parisNow(); if (view === 'list') sync(); }, 60000);
  loadRatings(); loadAndou(); loadCounts();
  setInterval(() => { if (!document.hidden) { loadRatings(); loadCounts(); } }, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadRatings(); });
})();
</script>

</body>
